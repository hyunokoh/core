# Patroni's persistent YAML config. The Spilo image merges /etc/patroni/*.yaml
# with the rendered /home/postgres/postgres.yml at boot, so anything here
# layers on top of Spilo's defaults.
#
# Anything reachable via PATRONI_* env (loop_wait, ttl, ...) is duplicated in
# the StatefulSet — env wins. We keep the bulkier bootstrap.dcs and
# postgresql.parameters blocks here because env-encoding them is painful.
apiVersion: v1
kind: ConfigMap
metadata:
  name: patroni-config
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/part-of: zkcex
data:
  patroni.yaml: |
    scope: zkcex
    namespace: /service/

    log:
      level: INFO
      format: '%(asctime)s %(levelname)s: %(message)s'

    restapi:
      listen: 0.0.0.0:8008

    # DCS = Kubernetes API. No external etcd to operate.
    kubernetes:
      use_endpoints: true
      labels:
        app.kubernetes.io/name: patroni
      role_label: spilo-role
      scope_label: cluster-name
      pod_ip: ${POD_IP}

    bootstrap:
      # Cluster-wide DCS settings written once at bootstrap. Re-applies on
      # `patronictl edit-config`; do NOT edit this file alone after bootstrap
      # — DCS is the source of truth from that point.
      dcs:
        ttl: 30
        loop_wait: 10
        retry_timeout: 10
        # 1 MiB. A replica trailing the leader by more than this on the WAL
        # stream is NOT eligible to be promoted on failover — promoting it
        # would mean accepting that 1 MiB of acknowledged writes is lost.
        maximum_lag_on_failover: 1048576
        # Auto-fail back to a recovered ex-leader is risky; let the operator
        # decide via `patronictl failover` or `switchover`.
        master_start_timeout: 300
        synchronous_mode: true
        synchronous_mode_strict: false
        # Synchronous_node_count=1 means: at least one sync standby; the
        # rest stream async. With 3 replicas and one sync slot, a single
        # standby outage doesn't block writes — the second async replica
        # is promoted to sync automatically.
        synchronous_node_count: 1
        postgresql:
          use_pg_rewind: true
          use_slots: true
          parameters:
            wal_level: replica
            hot_standby: "on"
            max_wal_senders: 10
            max_replication_slots: 10
            max_connections: 200
            wal_keep_size: 256MB
            wal_log_hints: "on"
            # synchronous_commit=on + synchronous_standby_names='*' means
            # any committed write is on at least one standby's WAL. With
            # synchronous_node_count=1 above, Patroni picks the sync standby
            # and updates this list as members come and go.
            synchronous_commit: "on"
            synchronous_standby_names: '*'
            # Logical safety belts.
            archive_mode: "on"
            archive_timeout: 1800s
            # Spilo's archive_command writes to wal-g; we use a noop when
            # USE_WALG_BACKUP=false. The wrapper handles the toggle.
            archive_command: /scripts/archive_command.sh "%p"

      # Roles + permissions created on initdb. Passwords come from PATRONI_*
      # env (which we set from Secrets).
      users:
        admin:
          password: ${PATRONI_admin_PASSWORD}
          options:
            - createrole
            - createdb

      # Bootstrap method: initdb on the first node, basebackup on the rest.
      # Patroni picks automatically based on whether the cluster exists in DCS.
      method: initdb
      initdb:
        - encoding: UTF8
          locale: C.UTF-8
          data-checksums

    postgresql:
      listen: 0.0.0.0:5432
      data_dir: /home/postgres/pgdata/pgroot/data
      bin_dir: /usr/lib/postgresql/15/bin
      pgpass: /home/postgres/.pgpass
      # Connection auth: hostssl from anywhere with md5/scram. Adjust for
      # in-cluster mTLS via Istio if enabled (then plain host is fine because
      # Istio terminates mTLS one hop in).
      pg_hba:
        - local   all             all                                   trust
        - host    all             all             127.0.0.1/32          trust
        - host    all             all             0.0.0.0/0             scram-sha-256
        - host    replication     standby         0.0.0.0/0             scram-sha-256
      parameters:
        # Local overrides. Most knobs are in bootstrap.dcs above.
        shared_preload_libraries: 'bg_mon,pg_stat_statements'

    tags:
      # nofailover=false everywhere — every node can be promoted.
      nofailover: false
      noloadbalance: false
      clonefrom: false
      nosync: false

    watchdog:
      # Watchdog is the kernel-level safety belt that fences a fenced leader
      # that hasn't realized it's been demoted. In K8s, eviction + pod kill
      # serve a similar purpose; we leave the soft watchdog off in cluster.
      mode: off

    ctl:
      insecure: true
