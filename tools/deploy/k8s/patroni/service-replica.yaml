# Read-only fanout. kube-proxy load-balances incoming connections across all
# pods carrying spilo-role=replica. Use this for read-heavy queries
# (session lookups for dashboards, /admin search, analytics) — anything that
# can tolerate a few seconds of replication lag.
#
# WARNING: queries that immediately read what they just wrote will see stale
# data here. Route those at patroni-primary.
apiVersion: v1
kind: Service
metadata:
  name: patroni-replica
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/part-of: zkcex
    zkcex.io/postgres-role: replica
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/part-of: zkcex
    spilo-role: replica
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
    - name: patroni-api
      port: 8008
      targetPort: 8008
