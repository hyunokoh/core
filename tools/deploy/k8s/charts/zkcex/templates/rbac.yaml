{{- if .Values.rbac.create }}
# Leader-election Role: required only for singleton services.
# Allows reading/updating Lease objects in the namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zkcex-leader-elector
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
{{- range $name, $cfg := .Values.services }}
{{- if and $cfg.enabled $cfg.singleton }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-leader-elector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zkcex-leader-elector
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
---
{{- end }}
{{- end }}
{{- end }}
