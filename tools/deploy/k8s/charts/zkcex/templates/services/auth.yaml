{{- $svc := index .Values.services "auth" }}
{{- if $svc.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    {{- include "zkcex.labels" (dict "name" "auth" "Values" .Values "Release" .Release "Chart" .Chart) | nindent 4 }}
spec:
  replicas: {{ default 3 $svc.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "zkcex.selectorLabels" (dict "name" "auth") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zkcex.selectorLabels" (dict "name" "auth") | nindent 8 }}
        zkcex.io/region: {{ .Values.region | quote }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $svc.port | quote }}
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: auth
      terminationGracePeriodSeconds: 30
      # Distroless image runs as uid 65532 (nonroot).
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ default 65532 .Values.image.runAsUser }}
        runAsGroup: {{ default 65532 .Values.image.runAsGroup }}
        fsGroup: {{ default 65532 .Values.image.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: auth
              topologyKey: kubernetes.io/hostname
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: auth
                topologyKey: topology.kubernetes.io/zone
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: auth
      containers:
        - name: auth
          image: "{{ include "zkcex.image" (dict "name" "auth" "Values" .Values) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: "auth"
            - name: SERVICE_PORT
              value: {{ $svc.port | quote }}
            - name: AUTH_DB_BACKEND
              value: "postgres"
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: zkcex-postgres
                  key: dsn
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: zkcex-jwt
                  key: signing_key
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: zkcex-app-config
          readinessProbe:
            httpGet:
              path: {{ $svc.healthPath }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ $svc.healthPath }}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  labels:
    {{- include "zkcex.labels" (dict "name" "auth" "Values" .Values "Release" .Release "Chart" .Chart) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "zkcex.selectorLabels" (dict "name" "auth") | nindent 4 }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
      protocol: TCP
{{- end }}
