{{- if .Values.monitoring.podMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: zkcex-pods
  labels:
    app.kubernetes.io/part-of: zkcex
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: zkcex
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 30s
{{- end }}
