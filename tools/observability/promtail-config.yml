server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Python demo services log to /tmp/*.log; we tail those into Loki.
  - job_name: zkcex-python-services
    static_configs:
      - targets:
          - localhost
        labels:
          job: zkcex-python
          source: /tmp
          __path__: /var/log/zkcex/*.log

  # Promtail can also discover docker containers and tag logs by container name.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
    pipeline_stages:
      - docker: {}
