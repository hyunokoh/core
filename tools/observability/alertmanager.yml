global:
  resolve_timeout: 5m

route:
  receiver: zkcex-pagerduty-webhook
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = critical
      receiver: zkcex-pagerduty-webhook
      group_wait: 5s
      repeat_interval: 1h

receivers:
  - name: zkcex-pagerduty-webhook
    webhook_configs:
      - url: http://host.docker.internal:5641/webhook
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: ['alertname', 'cluster', 'service']
