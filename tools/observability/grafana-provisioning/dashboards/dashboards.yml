apiVersion: 1

providers:
  - name: zkcex-dashboards
    orgId: 1
    folder: zkCEX
    folderUid: zkcex
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
