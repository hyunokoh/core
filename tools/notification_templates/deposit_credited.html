<html><body style="font-family:Inter,Helvetica,sans-serif;background:#0b0f1a;color:#e6e9f0;padding:24px;">
<table style="max-width:560px;margin:0 auto;background:#11151f;border-radius:12px;padding:24px"><tr><td>
  <h1 style="margin:0 0 12px;font-size:20px;color:#e6e9f0">{title}</h1>
  <p style="margin:0 0 16px;color:#9aa3b3;line-height:1.5">{body}</p>
  <table style="width:100%;font-size:13px;color:#9aa3b3;border-collapse:collapse">
    <tr><td style="padding:6px 0;color:#5c6477">Asset</td><td><strong style="color:#e6e9f0">{asset}</strong></td></tr>
    <tr><td style="padding:6px 0;color:#5c6477">Amount</td><td><strong style="color:#e6e9f0">{amount}</strong></td></tr>
    <tr><td style="padding:6px 0;color:#5c6477">TX</td><td><span style="font-family:monospace;font-size:11px">{tx}</span></td></tr>
  </table>
  <p style="font-size:11px;color:#5c6477;margin-top:24px">Manage your notification preferences in the zkCEX app.</p>
</td></tr></table></body></html>
