services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
  kafka-1:
    environment:
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CLIENT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_LISTENERS=CLIENT://kafka-1:29092,EXTERNAL://kafka-1:9092
      - KAFKA_ADVERTISED_LISTENERS=CLIENT://kafka-1:29092,EXTERNAL://kafka-1:9092
      - KAFKA_INTER_BROKER_LISTENER_NAME=CLIENT
      - KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE=false
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_DEFAULT_REPLICATION_FACTOR=1
      - KAFKA_MIN_INSYNC_REPLICAS=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_AUTO_LEADER_REBALANCE_ENABLE=false
      # Keep ZK sessions short so a crashed broker can reclaim its broker id quickly.
      - KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS=6000
      - KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS=6000
      # E2E runs a single broker under tight local memory; keep broker heap conservative.
      - KAFKA_HEAP_OPTS=-Xms128m -Xmx256m
      - KAFKA_OPTS=
      - KAFKA_LOG4J_ROOT_LOGLEVEL=WARN
      - KAFKA_LOG4J_LOGGERS=kafka.controller=INFO,state.change.logger=INFO
  kafka-2:
    profiles:
      - full-stack
  kafka-3:
    profiles:
      - full-stack
  akhq:
    profiles:
      - full-stack
  eventlog:
    depends_on: !override
      - kafka-1
      - consul
      - vault
      - postgres-eventlog
    environment:
      - KAFKA_IP_PORT=kafka-1:29092
      - SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET=earliest
      - SPRING_CLOUD_BUS_ENABLED=false
      - JAVA_OPTS=-Xmx192m
      - OPEX_KAFKA_DLT_PARTITIONS=1
      - OPEX_KAFKA_DLT_REPLICAS=1
  matching-engine-duo:
    depends_on: !override
      - kafka-1
      - redis-duo
    environment:
      - JAVA_OPTS=-Xmx256m
      - KAFKA_IP_PORT=kafka-1:29092
      - SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET=earliest
      - SYMBOLS=SOL_USDT,DOGE_USDT,TON_USDT
      - OPEX_KAFKA_TOPIC_PARTITIONS=1
      - OPEX_KAFKA_TOPIC_REPLICAS=1
      - OPEX_KAFKA_TOPIC_MIN_INSYNC_REPLICAS=1
    volumes: !override
      - "./preferences.yml:/preferences.yml"
  auth:
    profiles:
      - full-stack
    environment:
      - SPRING_CLOUD_BUS_ENABLED=false
      - JAVA_OPTS=-Xmx192m
    volumes: !override
      - "./preferences.yml:/preferences.yml"
  api:
    profiles:
      - full-stack
    environment:
      - JAVA_OPTS=-Xmx256m
      - SPRING_CLOUD_BUS_ENABLED=false
      - SPRING_PROFILES_ACTIVE=e2e
      - ACCOUNTANT_URL=http://opex-accountant
      - MATCHING_GATEWAY_URL=http://opex-matching-gateway
      - WALLET_URL=http://opex-wallet
      - MARKET_URL=http://opex-market
      - BC_GATEWAY_URL=http://opex-bc-gateway
    volumes: !override
      - "./preferences.yml:/preferences.yml"
  bc-gateway:
    profiles:
      - full-stack
    depends_on: !override
      - kafka-1
      - consul
      - vault
      - wallet
      - postgres-bc-gateway
    environment:
      - JAVA_OPTS=-Xmx224m
      - KAFKA_IP_PORT=kafka-1:29092
      - SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET=earliest
      - SPRING_CLOUD_BUS_ENABLED=false
      - ADDRESS_EXP_TIME=3600
    volumes: !override
      - "./preferences.yml:/preferences.yml"
  redis:
    ports: !override
      - "127.0.0.1:16379:6379"
  wallet:
    depends_on: !override
      - kafka-1
      - consul
      - vault
      - postgres-wallet
    environment:
      - JAVA_OPTS=-Xmx256m
      - KAFKA_IP_PORT=kafka-1:29092
      - SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET=earliest
      - SPRING_KAFKA_ADMIN_AUTO_CREATE=false
      - SPRING_CLOUD_BUS_ENABLED=false
      - SPRING_PROFILES_ACTIVE=e2e
      - APP_SWAGGER_ENABLED=false
      - APP_KAFKA_TOPICS_ENABLED=false
      - SPRINGFOX_DOCUMENTATION_ENABLED=false
    volumes: !override
      - "./preferences.yml:/preferences.yml"
      - "./drive-key.json:/drive-key.json"
  accountant:
    depends_on: !override
      - kafka-1
      - wallet
      - consul
      - vault
      - postgres-accountant
    environment:
      - JAVA_OPTS=-Xmx224m
      - KAFKA_IP_PORT=kafka-1:29092
      - SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET=earliest
      - SPRING_CLOUD_BUS_ENABLED=false
      - SPRING_MAIN_WEB_APPLICATION_TYPE=reactive
      - OPEX_KAFKA_TOPIC_PARTITIONS=1
      - OPEX_KAFKA_TOPIC_REPLICAS=1
      - OPEX_KAFKA_TOPIC_MIN_INSYNC_REPLICAS=1
    volumes: !override
      - "./preferences.yml:/preferences.yml"
  matching-engine:
    depends_on: !override
      - kafka-1
      - redis
    environment:
      - JAVA_OPTS=-Xmx224m
      - KAFKA_IP_PORT=kafka-1:29092
      - SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET=earliest
      - SYMBOLS=ETH_USDT,BTC_USDT
      - OPEX_KAFKA_TOPIC_PARTITIONS=1
      - OPEX_KAFKA_TOPIC_REPLICAS=1
      - OPEX_KAFKA_TOPIC_MIN_INSYNC_REPLICAS=1
    volumes: !override
      - "./preferences.yml:/preferences.yml"
  matching-gateway:
    depends_on: !override
      - kafka-1
      - consul
      - matching-engine
    environment:
      - JAVA_OPTS=-Xmx224m
      - KAFKA_IP_PORT=kafka-1:29092
      - SPRING_PROFILES_ACTIVE=e2e
      - APP_KAFKA_HEALTH_MIN_NODES=1
    volumes: !override
      - "./preferences.yml:/preferences.yml"
  market:
    depends_on: !override
      - kafka-1
      - consul
      - vault
      - postgres-market
      - redis-cache
    environment:
      - JAVA_OPTS=-Xmx224m
      - KAFKA_IP_PORT=kafka-1:29092
      - SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET=earliest
      - SPRING_CLOUD_BUS_ENABLED=false
      - OPEX_KAFKA_TOPIC_PARTITIONS=1
      - OPEX_KAFKA_TOPIC_REPLICAS=1
      - OPEX_KAFKA_TOPIC_MIN_INSYNC_REPLICAS=1
    volumes: !override
      - "./preferences.yml:/preferences.yml"
