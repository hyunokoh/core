name:  Build, Test, and Deploy otc (DEV env) services for specific partner
on:
#  push:
#    branches:
#      - dev

  workflow_dispatch:
    inputs:
      partner_name:
        type: string
        description: 'The name of the partner (provided during workflow execution)'
        required: true
        default: default

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        java: [ 21 ]

    name: Build OPEX and run tests with java ${{ matrix.java }} (otc)
    env:
      TAG: otc-dev
      PARTNER: ${{ github.event.inputs.partner_name || 'default' }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Fetch partners config
        id: download_partners_data
        run: |
          curl -L -o partner_mappings.yml -H "Authorization: token  ${{secrets.PARTNERS_ACCESS_TOKEN}} " https://raw.githubusercontent.com/opexdev/partners/main/partner_mappings.yml

      - name: Pars partners config file
        id: read_partners_data
        run: |
          yaml() {
           python3 -c "import yaml;print(yaml.safe_load(open('$1'))$2)"
          }
          SSH_HOST="$(yaml partner_mappings.yml "['partners']['${{env.PARTNER}}']['SSH_HOST']")"
          SSH_DIR="$(yaml partner_mappings.yml "['partners']['${{env.PARTNER}}']['SSH_DIR']")"
          SSH_PRIVATE_KEY="$(yaml partner_mappings.yml "['partners']['${{env.PARTNER}}']['SSH_PRIVATE_KEY']")"
          SSH_USER="$(yaml partner_mappings.yml "['partners']['${{env.PARTNER}}']['SSH_USER']")"
          PASSWORD="$(yaml partner_mappings.yml "['partners']['${{env.PARTNER}}']['PASSWORD']")"
          ENV_PATH="$(yaml partner_mappings.yml "['partners']['${{env.PARTNER}}']['ENV_PATH']")"
          SSH_PORT="$(yaml partner_mappings.yml "['partners']['${{env.PARTNER}}']['SSH_PORT']")"
          export SSH_HOST SSH_DIR SSH_PRIVATE_KEY SSH_USER PASSWORD ENV_PATH SSH_PORT

          echo "::add-mask::$SSH_HOST"
          echo "::add-mask::$SSH_DIR"
          echo "::add-mask::$SSH_PRIVATE_KEY"
          echo "::add-mask::$SSH_USER"
          echo "::add-mask::$PASSWORD"
          echo "::add-mask::$ENV_PATH"
          echo "::add-mask::$SSH_PORT"

          {
            echo "SSH_HOST=$SSH_HOST"
            echo "SSH_DIR=$SSH_DIR"
            echo "SSH_PRIVATE_KEY=$SSH_PRIVATE_KEY"
            echo "SSH_USER=$SSH_USER"
            echo "PASSWORD=$PASSWORD"
            echo "ENV_PATH=$ENV_PATH"
            echo "SSH_PORT=$SSH_PORT"
          } >> "$GITHUB_OUTPUT"

      - name: Decrypt data
        id: decrypt_data

        run: |
          printf '%s\n' "${{ steps.read_partners_data.outputs.SSH_HOST }}" | openssl aes-256-cbc -d -a -pass pass:"${{secrets.PARTNERS_KEY }}" > decrypted_ssh_host.txt
          printf '%s\n' "${{ steps.read_partners_data.outputs.SSH_DIR }}" | openssl aes-256-cbc -d -a -pass pass:"${{secrets.PARTNERS_KEY }}" > decrypted_dir.txt
          printf '%s\n' "${{ steps.read_partners_data.outputs.SSH_USER }}" | openssl aes-256-cbc -d -a -pass pass:"${{secrets.PARTNERS_KEY }}" > decrypted_user.txt
          printf '%s\n' "${{ steps.read_partners_data.outputs.PASSWORD }}" | openssl aes-256-cbc -d -a -pass pass:"${{secrets.PARTNERS_KEY }}" > decrypted_password.txt

          curl -L -o priv_file.txt -H "Authorization: token  ${{secrets.PARTNERS_ACCESS_TOKEN}} " "https://raw.githubusercontent.com/opexdev/partners/main/${{ steps.read_partners_data.outputs.SSH_PRIVATE_KEY }}"
          openssl aes-256-cbc -d -a -pass pass:"${{secrets.PARTNERS_KEY }}" < priv_file.txt > decrypted_private_key.txt
          SSH_SECRET_NN="$(tr -s '\r\n' '#' < decrypted_private_key.txt)"

          user_ssh="$(< decrypted_user.txt)"
          ssh_dir="$(< decrypted_dir.txt)"
          ssh_host="$(< decrypted_ssh_host.txt)"
          env_path="${{ steps.read_partners_data.outputs.ENV_PATH }}"
          ssh_port="${{ steps.read_partners_data.outputs.SSH_PORT}}"
          server_pass="$(< decrypted_password.txt)"
          export SSH_SECRET_NN user_ssh ssh_dir ssh_host env_path ssh_port server_pass

          echo "::add-mask::$ssh_dir"
          echo "::add-mask::$SSH_SECRET_NN"
          echo "::add-mask::$ssh_host"
          echo "::add-mask::$env_path"
          echo "::add-mask::$server_pass"
          echo "::add-mask::$user_ssh"
          echo "::add-mask::$ssh_port"

          {
            echo "ssh_user=$user_ssh"
            echo "ssh_dir=$ssh_dir"
            echo "ssh_host=$ssh_host"
            echo "ssh_secret=$SSH_SECRET_NN"
            echo "env_path=$env_path"
            echo "ssh_port=$ssh_port"
            echo "password=$server_pass"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        run:  |
          mvn -pl common -am  -B -T 1C clean install -Potc
          mvn -pl wallet,bc-gateway -amd  -B -T 1C clean install -Potc

      - name: Run Tests
        run: |
          mvn -pl common -am -B -T 1C -Dskip.unit.tests=false surefire:test
          mvn -pl wallet,bc-gateway -amd  -B -T 1C -Dskip.unit.tests=false surefire:test

      - name: Build Docker images
        run: docker compose -f docker-compose-otc.build.yml build

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images to GitHub Container Registry
        run: docker compose -f docker-compose-otc.build.yml push


      - name: Pull docker images in dest server
        env:
          token: ${{secrets.PARTNERS_ACCESS_TOKEN}}

        run: |
          SSH_USER="${{steps.decrypt_data.outputs.ssh_user }}"
          SSH_DIR="${{ steps.decrypt_data.outputs.ssh_dir }}"
          SSH_HOST="${{ steps.decrypt_data.outputs.ssh_host }}"
          SERVER_PASSWORD="${{ steps.decrypt_data.outputs.password }}"
          ENV_PATH="${{ steps.decrypt_data.outputs.env_path }}"
          SSH_PORT="${{ steps.decrypt_data.outputs.ssh_port }}"
          export SSH_USER SSH_DIR SSH_HOST SERVER_PASSWORD ENV_PATH SSH_PORT

          remote_env="$(printf 'SSH_DIR=%q ENV_PATH=%q SERVER_PASSWORD=%q PARTNERS_TOKEN=%q' "$SSH_DIR" "$ENV_PATH" "$SERVER_PASSWORD" "$token")"
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no "$SSH_USER"@"$SSH_HOST" -p "$SSH_PORT" "$remote_env bash -s" <<'REMOTE'
          set -e
          cd "$SSH_DIR"
          curl "https://raw.githubusercontent.com/opexdev/partners/main/$ENV_PATH" -L -o .env -H "Authorization:token $PARTNERS_TOKEN"
          printf '%s\n' "$SERVER_PASSWORD" | sudo -S docker compose -f docker-compose-otc.yml pull
          printf '%s\n' "$SERVER_PASSWORD" | sudo -S docker network create --driver bridge otc-network || true
          printf '%s\n' "$SERVER_PASSWORD" | sudo -S docker compose -f docker-compose-otc.yml -f docker-compose-otc.local.yml up -d
          REMOTE
