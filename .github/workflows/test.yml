name: test
on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install pytest pytest-cov pg8000
      - run: pytest tools/ -v -m "not integration and not live" --cov=tools --cov-report=xml --cov-report=term
      - uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app-password
          POSTGRES_DB: zkcex_auth
        ports:
          - '5433:5432'
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install pytest pg8000
      - run: bash tools/run_integration_tests.sh
      - name: Print auth integration log
        if: failure()
        run: |
          if test -f /tmp/it-auth.log; then
            cat /tmp/it-auth.log
          fi
