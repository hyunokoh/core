name: build
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth
          - chain
          - pol-py
          - ws-feed
          - perp
          - mcp
          - mm-bot
          - safu
          - ops
          - travel-rule
          - zk-orderbook
          - waf
          - proxy
          - push
          - order-engine
          - api-key
          - export
          - custody-coord
          - custody-signer
          - metrics-aggregator
          - pagerduty-webhook
          - backup
          - pol-feed
          - zkpol-bridge
    steps:
      - uses: actions/checkout@v5

      # QEMU is required so the amd64 GitHub runner can cross-compile arm64
      # images. Without this, --platform linux/arm64 fails with
      # "exec format error".
      - name: Set up QEMU
        if: github.event_name == 'push'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Distroless service images FROM zkcex-base:latest. PR builds use
      # plain docker build so the local daemon can resolve that base image.
      # Push builds publish a multi-arch base first, then rewrite service
      # Dockerfiles to pull the registry-qualified base tag.
      - name: Build base (PR)
        if: github.event_name == 'pull_request'
        run: docker build -f ./deploy/images/Dockerfile.base -t zkcex-base:latest .

      - name: Build base (push, multi-arch)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/images/Dockerfile.base
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/zkcex-base:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max

      # For push builds, swap the FROM line so the service builder pulls the
      # multi-arch base just published above. PR builds use the locally
      # loaded zkcex-base:latest.
      - name: Rewrite FROM for push builds
        if: github.event_name == 'push'
        run: |
          sed -i.bak \
            "s|FROM zkcex-base:latest|FROM ghcr.io/${{ github.repository_owner }}/zkcex-base:${{ github.sha }}|" \
            ./deploy/images/Dockerfile.${{ matrix.service }}

      - name: Build image (PR)
        if: github.event_name == 'pull_request'
        run: |
          docker build \
            --build-arg SERVICE=${{ matrix.service }} \
            -f ./deploy/images/Dockerfile.${{ matrix.service }} \
            -t ghcr.io/${{ github.repository_owner }}/zkcex-${{ matrix.service }}:${{ github.sha }} \
            .

      - name: Build image (push)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/images/Dockerfile.${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            SERVICE=${{ matrix.service }}
          tags: ghcr.io/${{ github.repository_owner }}/zkcex-${{ matrix.service }}:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Trivy scan
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/zkcex-${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
