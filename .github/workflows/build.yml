name: build
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth
          - chain
          - pol-py
          - ws-feed
          - perp
          - mcp
          - mm-bot
          - safu
          - ops
          - travel-rule
          - zk-orderbook
          - waf
          - proxy
          - push
          - order-engine
          - api-key
          - export
          - custody-coord
          - custody-signer
          - metrics-aggregator
          - pagerduty-webhook
          - backup
          - pol-feed
          - zkpol-bridge
    steps:
      - uses: actions/checkout@v4

      # QEMU is required so the amd64 GitHub runner can cross-compile arm64
      # images. Without this, --platform linux/arm64 fails with
      # "exec format error".
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Distroless service images FROM zkcex-base:latest. On the runner we
      # need the base in the local daemon (single-arch) for PR builds, OR
      # pushed to the registry-qualified ref for multi-arch push builds.
      # For PRs (load=true) we build base single-arch only; for push builds
      # we publish the base multi-arch first, then services FROM the
      # registry-qualified ref.
      - name: Build base (PR, host-arch only)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/images/Dockerfile.base
          platforms: linux/amd64
          tags: zkcex-base:latest
          load: true
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max

      - name: Build base (push, multi-arch)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/images/Dockerfile.base
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/zkcex-base:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max

      # For push builds, swap the FROM line so the service builder pulls the
      # multi-arch base just published above. PR builds use the locally
      # loaded zkcex-base:latest.
      - name: Rewrite FROM for push builds
        if: github.event_name == 'push'
        run: |
          sed -i.bak \
            "s|FROM zkcex-base:latest|FROM ghcr.io/${{ github.repository_owner }}/zkcex-base:${{ github.sha }}|" \
            ./deploy/images/Dockerfile.${{ matrix.service }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/images/Dockerfile.${{ matrix.service }}
          # PRs build host-arch only (faster, --load works). Pushes produce
          # a multi-arch manifest list pushed to ghcr.
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          build-args: |
            SERVICE=${{ matrix.service }}
          tags: ghcr.io/${{ github.repository_owner }}/zkcex-${{ matrix.service }}:${{ github.sha }}
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Trivy scan
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/zkcex-${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
