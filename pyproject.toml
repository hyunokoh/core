[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zkcex"
version = "0.1.0"
description = "Verifiable digital-asset exchange backend"
requires-python = ">=3.11"

[tool.ruff]
# Keep Ruff's upgrade rules compatible with the local demo runner's Python 3.9.
target-version = "py39"
line-length = 100
extend-exclude = [
    "tools/.local",
    "deploy",
    "homepage",
    "sdks",
    "mobile",
    "tools/tests/e2e/node_modules",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "T20",    # flake8-print (no `print` in services)
]
ignore = [
    "E501",   # Line length — handled by formatter
    "S101",   # Assert allowed (used in tests + invariant checks)
    "T201",   # Print allowed in CLI tools
    "B008",   # Default args in function definitions (fine for our config patterns)
]

[tool.ruff.lint.per-file-ignores]
"tools/tests/*" = ["S101", "S106", "S107"]
"tools/_error_reporter.py" = ["S110"]   # Best-effort fire-and-forget catches all
"tools/backup/crypto.py" = ["E402"]     # Runtime path/bootstrap import ordering
"tools/custody/ethsign.py" = ["E402"]   # Optional dependency fallback bootstrap
"tools/i18n/extract.py" = ["E402"]      # Repo-root sys.path bootstrap
"tools/travel_rule_server.py" = ["E402"] # Adapter import after optional bootstrap
"**/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
# Start lenient; tighten over time.
disallow_untyped_defs = false
disallow_any_generics = false
ignore_missing_imports = true
exclude = [
    "tools/.local/",
    "deploy/",
    "homepage/",
    "sdks/",
    "mobile/",
    "tools/tests/e2e/",
]

[[tool.mypy.overrides]]
module = "tools.custody.*"
disallow_untyped_defs = true       # Security-critical code: full strict mode

[[tool.mypy.overrides]]
module = "tools.auth_server"
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tools/tests", "tools"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers --tb=short"
markers = [
    "integration: tests that hit live services (skip in unit-only runs)",
    "live: tests that require provisioned live or staging services",
    "slow: tests that take more than 5 seconds",
    "e2e: end-to-end browser tests (handled by playwright, not pytest)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pg8000.*",
]

[tool.coverage.run]
branch = true
source = ["tools"]
omit = [
    "*/.local/*",
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
