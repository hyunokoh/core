<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>알림함 / Inbox — zkCEX</title>
  <meta name="description" content="zkCEX in-app notification inbox: deposits, withdrawals, KYC, security, and price alerts." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0b3aff" />
  <style>
    .inbox-page { max-width: 760px; margin: 0 auto; padding: 24px 18px 80px; }
    .inbox-toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center;
                     margin: 8px 0 16px; }
    .pill { padding: 6px 12px; border-radius: 999px; background: var(--panel-2, #161b27);
            border: 1px solid var(--line, #1d2230); color: var(--ink-mute, #9aa3b3);
            font-size: 13px; cursor: pointer; user-select: none; }
    .pill.active { background: var(--accent-bright, #2a55ff); color: #fff; border-color: transparent; }
    .pill:hover:not(.active) { color: var(--ink, #e6e9f0); }
    .inbox-actions { margin-left: auto; display:flex; gap:8px; align-items:center; }
    .inbox-actions a { color: var(--ink-mute); font-size: 13px; text-decoration: none; }
    .inbox-actions a:hover { color: var(--ink); }
    .notif-card { display:flex; gap: 14px; padding: 14px 16px; background: var(--panel, #11151f);
                  border: 1px solid var(--line, #1d2230); border-radius: 12px; margin-bottom: 10px;
                  cursor: pointer; transition: border-color 120ms ease, background 120ms ease; }
    .notif-card:hover { border-color: var(--accent-bright, #2a55ff); }
    .notif-card.unread { background: rgba(11,58,255,0.06); }
    .notif-glyph { width: 38px; height: 38px; border-radius: 8px;
                   background: var(--panel-2, #161b27); display:flex; align-items:center;
                   justify-content:center; font-size: 11px; font-weight: 700;
                   letter-spacing: 0.04em; color: var(--ink-mute); flex: 0 0 auto; }
    .notif-card.unread .notif-glyph { background: var(--accent-soft, rgba(42,85,255,0.18)); color: #fff; }
    .notif-body { flex: 1 1 auto; min-width: 0; }
    .notif-title { font-weight: 600; font-size: 14px; color: var(--ink, #e6e9f0);
                   margin: 0 0 4px; }
    .notif-card.unread .notif-title::after { content: ""; display: inline-block; width: 8px;
                                              height: 8px; border-radius: 50%;
                                              background: var(--accent-bright); margin-left: 8px;
                                              vertical-align: middle; }
    .notif-snippet { font-size: 13px; color: var(--ink-mute); margin: 0;
                     overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .notif-time { font-size: 11px; color: var(--ink-dim); margin-top: 4px; }
    .empty-state { text-align: center; padding: 60px 16px; color: var(--ink-mute, #9aa3b3); }
    .empty-state .big { font-size: 48px; line-height: 1; margin-bottom: 12px; opacity: 0.4; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.55);
                      display:flex; align-items:center; justify-content:center; z-index: 50; }
    .modal { background: var(--panel, #11151f); border: 1px solid var(--line, #1d2230);
             border-radius: 14px; max-width: 520px; width: calc(100% - 32px); padding: 22px;
             max-height: 80vh; overflow:auto; }
    .modal h2 { margin: 0 0 12px; font-size: 18px; }
    .modal p { color: var(--ink-mute); font-size: 14px; line-height: 1.5; margin: 0 0 12px; }
    .modal .meta-table { width: 100%; border-collapse: collapse; font-size: 12px;
                          color: var(--ink-mute); margin-top: 8px; }
    .modal .meta-table td { padding: 6px 0; vertical-align: top; }
    .modal .meta-table td:first-child { color: var(--ink-dim); padding-right: 12px; width: 30%; }
    .modal-actions { display:flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  </style>
</head>
<body>
<a class="skip-link" href="#main">본문으로 건너뛰기 / Skip to content</a>

<div id="app-header"></div>

<main id="main" class="inbox-page">
  <section class="page-heading">
    <h1>알림함<span class="en">Inbox</span></h1>
    <p>입금, 출금, KYC, 보안, 가격 알림 / Deposits, withdrawals, KYC, security, and price alerts.</p>
  </section>

  <div class="inbox-toolbar">
    <button class="pill active" data-filter="all" type="button">전체 / All</button>
    <button class="pill" data-filter="unread" type="button">안 읽음 / Unread</button>
    <button class="pill" data-filter="financial" type="button">자산 / Financial</button>
    <button class="pill" data-filter="critical" type="button">보안 / Security</button>
    <button class="pill" data-filter="system" type="button">시스템 / System</button>
    <button class="pill" data-filter="marketing" type="button">프로모션 / Promo</button>
    <div class="inbox-actions">
      <button class="btn btn-ghost btn-sm" id="mark-all" type="button">모두 읽음 / Mark all read</button>
      <a href="notification-settings.html">설정 / Settings</a>
    </div>
  </div>

  <div id="inbox-list">
    <div class="empty-state">불러오는 중… / Loading…</div>
  </div>
</main>

<div id="app-footer"></div>

<script type="module">
  import { renderHeader, renderFooter, requireSession, authedFetch, escapeHtml, toast } from "./app.js";

  renderHeader("more");
  renderFooter();
  const session = requireSession();
  if (!session) { /* redirected */ }

  let allNotifications = [];
  let activeFilter = "all";

  function relativeTime(ts) {
    const d = Math.max(0, Math.floor(Date.now()/1000) - (ts || 0));
    if (d < 60) return `${d}초 전 / ${d}s ago`;
    if (d < 3600) return `${Math.floor(d/60)}분 전 / ${Math.floor(d/60)}m ago`;
    if (d < 86400) return `${Math.floor(d/3600)}시간 전 / ${Math.floor(d/3600)}h ago`;
    return `${Math.floor(d/86400)}일 전 / ${Math.floor(d/86400)}d ago`;
  }

  function applyFilter() {
    if (activeFilter === "all") return allNotifications;
    if (activeFilter === "unread") return allNotifications.filter(n => !n.read);
    return allNotifications.filter(n => n.category === activeFilter);
  }

  function render() {
    const host = document.getElementById("inbox-list");
    const list = applyFilter();
    if (!list.length) {
      host.innerHTML = `
        <div class="empty-state">
          <div class="big">📭</div>
          <div>알림이 없습니다 / No notifications yet</div>
        </div>`;
      return;
    }
    host.innerHTML = list.map(n => `
      <div class="notif-card ${n.read ? "" : "unread"}" data-id="${n.id}">
        <div class="notif-glyph">${escapeHtml(n.glyph || "?")}</div>
        <div class="notif-body">
          <p class="notif-title">${escapeHtml(n.title)}</p>
          <p class="notif-snippet">${escapeHtml(n.body)}</p>
          <p class="notif-time">${relativeTime(n.created_at)}</p>
        </div>
      </div>
    `).join("");
    Array.from(host.querySelectorAll(".notif-card")).forEach(el => {
      el.addEventListener("click", () => openDetail(parseInt(el.dataset.id, 10)));
    });
  }

  function openDetail(id) {
    const n = allNotifications.find(x => x.id === id);
    if (!n) return;
    // Mark read (best-effort).
    if (!n.read) {
      n.read = true;
      authedFetch(`/notifications/${id}/read`, { method: "POST" }).catch(() => {});
      render();
    }
    const meta = n.metadata || {};
    const metaRows = Object.keys(meta).map(k =>
      `<tr><td>${escapeHtml(k)}</td><td>${escapeHtml(String(meta[k]))}</td></tr>`
    ).join("");
    const back = document.createElement("div");
    back.className = "modal-backdrop";
    back.innerHTML = `
      <div class="modal" role="dialog" aria-modal="true">
        <h2>${escapeHtml(n.title)}</h2>
        <p>${escapeHtml(n.body)}</p>
        ${metaRows ? `<table class="meta-table">${metaRows}</table>` : ""}
        <div class="modal-actions">
          <a class="btn btn-ghost btn-sm" href="${n.jump_url || "#"}">이동 / Jump to</a>
          <button class="btn btn-primary btn-sm" data-action="close" type="button">닫기 / Close</button>
        </div>
      </div>
    `;
    back.addEventListener("click", (e) => {
      if (e.target === back || e.target.matches('[data-action="close"]')) back.remove();
    });
    document.body.appendChild(back);
  }

  async function load() {
    try {
      const resp = await authedFetch("/notifications/inbox?limit=100");
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      const obj = await resp.json();
      allNotifications = obj.notifications || [];
      render();
    } catch (e) {
      document.getElementById("inbox-list").innerHTML =
        `<div class="empty-state"><div>알림을 불러올 수 없습니다 / Could not load: ${escapeHtml(String(e))}</div></div>`;
    }
  }

  Array.from(document.querySelectorAll(".pill[data-filter]")).forEach(p => {
    p.addEventListener("click", () => {
      document.querySelectorAll(".pill[data-filter]").forEach(x => x.classList.remove("active"));
      p.classList.add("active");
      activeFilter = p.dataset.filter;
      render();
    });
  });

  document.getElementById("mark-all").addEventListener("click", async () => {
    try {
      const r = await authedFetch("/notifications/mark-all-read", { method: "POST" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      toast(`${j.updated || 0}건 읽음 처리 / ${j.updated || 0} marked read`);
      load();
    } catch (e) {
      toast("실패 / Failed: " + e);
    }
  });

  load();
  // Refresh every 30s so the badge + list stay in sync with push events.
  setInterval(load, 30000);
</script>

</body>
</html>
