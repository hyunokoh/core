global
  maxconn 100

defaults
  log global
  mode tcp
  retries 2
  timeout client 30m
  timeout connect 4s
  timeout server 30m
  timeout check 5s

# Stats UI on :7000 — shows which backend is up/down and which one is
# currently serving as leader.
listen stats
  bind *:7000
  mode http
  stats enable
  stats uri /
  stats refresh 5s

# Read-write entry. Patroni's REST endpoint /leader returns 200 only on the
# currently elected leader; the other two nodes return 503. HAProxy therefore
# marks them as DOWN and never routes RW traffic there.
listen postgres-rw
  bind *:5000
  option httpchk OPTIONS /leader
  http-check expect status 200
  default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
  server node-a patroni-node-a:5432 maxconn 100 check port 8008
  server node-b patroni-node-b:5432 maxconn 100 check port 8008
  server node-c patroni-node-c:5432 maxconn 100 check port 8008

# Read-only entry. /replica returns 200 on streaming replicas that are up to
# date and not in maintenance. HAProxy load-balances across all healthy
# replicas using its default round-robin.
listen postgres-ro
  bind *:5001
  option httpchk OPTIONS /replica
  http-check expect status 200
  default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
  server node-a patroni-node-a:5432 maxconn 100 check port 8008
  server node-b patroni-node-b:5432 maxconn 100 check port 8008
  server node-c patroni-node-c:5432 maxconn 100 check port 8008
